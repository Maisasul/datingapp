@if (memberService.member(); as member) {
  <div class="flex flex-col md:flex-row gap-6 max-w-7xl mx-auto p-4 items-start">
    <div class="card bg-base-100 shadow-xl border border-base-200 w-full md:w-80 shrink-0 sticky top-4">
      <div class="p-6 flex flex-col items-center text-center">
        <div class="avatar mb-4">
          <div class="w-24 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2">
            <img [src]="member.imageUrl || '/user.png'" [alt]="member.displayName" class="object-cover" />
          </div>
        </div>
        <h2 class="text-xl font-bold text-primary">
          {{member.displayName}}, {{member.dateOfBirth |age}}
        </h2>
        <p class="text-xs text-base-content/70 mt-1 flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          {{member.city}}, {{member.country}}
        </p>
      </div>
      <div class="divider my-0 px-4"></div>
      <div class="p-4">
        <ul class="menu menu-sm bg-base-100 rounded-box w-full gap-1 p-0">
          <li>
            <a routerLink="profile" routerLinkActive="active" class="font-medium">
              Profile
            </a>
          </li>
          <li>
            <a routerLink="photos" routerLinkActive="active" class="font-medium">
              Photos
            </a>
          </li>
          <li>
            <a routerLink="messages" routerLinkActive="active" class="font-medium">
              Messages
            </a>
          </li>
        </ul>
      </div>
      <div class="divider my-0 px-4"></div>
      <div class="p-4 flex gap-2">
        <button class="btn btn-outline btn-sm flex-1">Go back</button>
        <button class="btn btn-primary btn-sm flex-1">Link user</button>
      </div>
    </div>
    <div class="card bg-base-100 shadow-xl border border-base-200 flex-1 w-full min-h-125">
      <div class="card-body p-6">
        <div class="flex justify-between items-center">
          <h3 class="card-title text-2xl font-bold text-primary">{{title()}}</h3>
          @if (isCurrentUser()) {
            <button (click)="memberService.editMode.set(!memberService.editMode())" class="btn btn-outline btn-primary">
              {{memberService.editMode() ? 'Cancel' : 'Edit'}}
            </button>
          }
        </div>
        <div class="divider my-2"></div>
        <div>
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>
  </div>
} @else {
  <div class="alert alert-error max-w-md mx-auto mt-8 shadow-lg">
    <span>Member not found</span>
  </div>
}
